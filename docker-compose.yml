x-mock-sensor: &mock-sensor
  build: .
  image: labmon:latest
  depends_on:
    influxdb:
      condition: service_healthy
  environment:
    - INFLUXDB_HOST=http://influxdb:8181
    - INFLUXDB_DATABASE=lab
    - INFLUXDB3_AUTH_TOKEN=${INFLUXDB3_AUTH_TOKEN}

services:
  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    ports:
      - "8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=${INFLUXDB_NODE_ID}
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    volumes:
      - type: bind
        # Path to store data on host system
        source: .influxdb3/data
        # Path to store data in the container
        target: /var/lib/influxdb3/data
    # influxdb3 takes a few seconds to start accepting connections after the
    # container starts, so `docker compose up -d --wait` needs this to know
    # when the server is actually ready (any HTTP response counts, even 401).
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8181/health"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 5s

  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - INFLUXDB3_AUTH_TOKEN=${INFLUXDB3_AUTH_TOKEN}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana/dashboards
      - type: bind
        # Grafana's own state (users, sessions, dashboard edits made via the UI)
        source: .grafana/data
        target: /var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 5s

  mock-room-1:
    <<: *mock-sensor
    container_name: mock-room-1
    command:
      - --sensor-id=room-1
      - --measurement=temperature
      - --setpoint=21
      - --noise=0.15
      - --unit=°C

  mock-room-2:
    <<: *mock-sensor
    container_name: mock-room-2
    command:
      - --sensor-id=room-2
      - --measurement=temperature
      - --setpoint=22
      - --noise=0.15
      - --unit=°C

  mock-cryo-77k:
    <<: *mock-sensor
    container_name: mock-cryo-77k
    command:
      - --sensor-id=cryo-77k
      - --measurement=temperature
      - --setpoint=77
      - --noise=0.3
      - --unit=K

  mock-cryo-4k:
    <<: *mock-sensor
    container_name: mock-cryo-4k
    command:
      - --sensor-id=cryo-4k
      - --measurement=temperature
      - --setpoint=4.2
      - --noise=0.05
      - --unit=K

  mock-pressure:
    <<: *mock-sensor
    container_name: mock-pressure
    command:
      - --sensor-id=chamber-1
      - --measurement=pressure
      - --setpoint=1e-7
      - --noise=0.05
      - --log-scale
      - --unit=mbar
