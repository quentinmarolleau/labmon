x-mock-sensor: &mock-sensor
  build: .
  image: labmon:latest
  profiles: [demo]
  depends_on:
    influxdb:
      condition: service_healthy
  environment:
    - INFLUXDB_HOST=http://influxdb:8181
    - INFLUXDB_DATABASE=${INFLUXDB_DATABASE:-lab}
    - INFLUXDB3_AUTH_TOKEN=${INFLUXDB3_AUTH_TOKEN}

services:
  # Prepares the bind-mounted state directories, then exits. Docker creates
  # a missing bind-mount source as root:root, which leaves influxdb3
  # (uid 1500), Grafana (uid 472) and Loki (uid 10001) unable to write to
  # their own data dirs — so on a fresh clone InfluxDB dies with "failed to
  # initialize catalog: Permission denied" and every other service fails its
  # dependency. Doing it here rather than in a documented `sudo chown` keeps
  # the quickstart to two commands and needs no host privileges beyond
  # Docker itself.
  #
  # .loki/data is prepared unconditionally even though Loki is behind the
  # `logs` profile: this service cannot know which profiles are active, and
  # an unused empty directory costs nothing.
  #
  # The parent directories are handed to whoever owns the repo, read at run
  # time rather than guessed, so they stay removable without root. Re-running
  # is a no-op once the ownership is already right.
  init-state-dirs:
    image: influxdb:3-core
    container_name: labmon-init-state-dirs
    user: "0:0"
    # The repo root has to be writable to create .influxdb3/ and .grafana/
    # themselves; nothing outside those two paths is touched.
    volumes:
      - type: bind
        source: .
        target: /repo
    command:
      - sh
      - -c
      - |
        set -e
        owner="$$(stat -c '%u:%g' /repo)"
        mkdir -p /repo/.influxdb3/data /repo/.grafana/data /repo/.loki/data
        chown "$$owner" /repo/.influxdb3 /repo/.grafana /repo/.loki
        chown 1500:1500 /repo/.influxdb3/data
        chown 472:0 /repo/.grafana/data
        chown 10001:10001 /repo/.loki/data
        chmod 755 /repo/.influxdb3/data /repo/.grafana/data /repo/.loki/data
        echo 'level=info logger=init-state-dirs msg="state directories ready"'

  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    # Comes back after a reboot or a daemon restart, but stays down once
    # deliberately stopped. This half of the deployment is the always-on
    # one: without it a power cut leaves the stack down until somebody
    # notices, while every client fills its queue and then blocks.
    restart: unless-stopped
    depends_on:
      init-state-dirs:
        condition: service_completed_successfully
    ports:
      # Loopback by default. Short syntax (`"8181:8181"`) binds every
      # interface, which on a laptop following the quickstart publishes
      # this to whatever network it is attached to. A server that clients
      # push to sets LABMON_BIND_ADDRESS=0.0.0.0 — see docs/deployment.md.
      - "${LABMON_BIND_ADDRESS:-127.0.0.1}:8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=${INFLUXDB_NODE_ID:-node0}
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      # Everything influxdb3 emits at steady state is one line per
      # write-ahead-log flush: a write is appended to the WAL for
      # durability, and once a second that buffer is flushed to the
      # object store and the flush is logged. That is 86,400 lines a
      # day, ~2.6M over the default retention window, and with the
      # `logs` profile on it is the entire stored log. See
      # docs/logging.md, and docs/latency.md for why the same interval
      # sets the cost of a single write.
      # The line is genuinely diagnostic, so it is lowered rather than
      # dropped: it reappears at `warn` and above, and `debug` brings it
      # back in full.
      #
      # The two directives before it are influxdb3's own default, which
      # passing this flag would otherwise replace — dropping them would
      # re-enable the query-log noise they exist to suppress.
      - --log-filter=info,iox_query::query_log=warn,influxdb3_query_executor::query_planner=warn,influxdb3_wal::object_store=warn
    volumes:
      - type: bind
        # Path to store data on host system
        source: .influxdb3/data
        # Path to store data in the container
        target: /var/lib/influxdb3/data
    # influxdb3 takes a few seconds to start accepting connections after the
    # container starts, so `docker compose up -d --wait` needs this to know
    # when the server is actually ready.
    #
    # This opens the port and closes it without sending a request, which is
    # what makes it silent. Every influxdb3 endpoint answers 401 without a
    # token — and the token is issued by this server, so during first-time
    # setup there is none to send. An HTTP probe therefore had to accept 401
    # as proof of life, and influxdb3 logged an ERROR for each one: ~164,000
    # lines a day, invisible while logs were ephemeral and ~5 million per
    # retention window once the `logs` profile stores them. A TCP connect
    # asks nothing, so there is nothing to reject and nothing to log.
    #
    # It proves the listener is bound rather than that HTTP answers, which
    # is all the 401 probe established either. `nc` is not in the image;
    # bash is, and /dev/tcp is a bash builtin rather than a binary.
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8181'"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 5s

  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    # Comes back after a reboot or a daemon restart, but stays down once
    # deliberately stopped. This half of the deployment is the always-on
    # one: without it a power cut leaves the stack down until somebody
    # notices, while every client fills its queue and then blocks.
    restart: unless-stopped
    depends_on:
      init-state-dirs:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    ports:
      # Loopback by default, for the reason given on InfluxDB's port
      # above — more sharply here, since this one answers a login prompt
      # whose default password is `admin`.
      - "${LABMON_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      - INFLUXDB3_AUTH_TOKEN=${INFLUXDB3_AUTH_TOKEN}
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE:-lab}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Extra panel plugins, empty by default so a server install stays
      # offline-capable; the demo's .env sets it (see docs/demo-stack.md).
      # "_SYNC" installs before Grafana starts, so a provisioned dashboard
      # never loads while its panel type is still missing. Note that
      # GF_INSTALL_PLUGINS is deprecated in this image and ignored unless
      # GF_INSTALL_PLUGINS_FORCE is also set.
      - GF_PLUGINS_PREINSTALL_SYNC=${GRAFANA_PLUGINS:-}
    volumes:
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana/dashboards
      - type: bind
        # Grafana's own state (users, sessions, dashboard edits made via the UI)
        source: .grafana/data
        target: /var/lib/grafana
    healthcheck:
      # Left at one second on purpose. Grafana's /api/health answers 200
      # without a token and logs nothing per probe, so it never contributed
      # to the noise that changed the InfluxDB check above — slowing it down
      # would only delay noticing that Grafana had died.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 5s

  # Log aggregation, behind the `logs` profile: off unless COMPOSE_PROFILES
  # asks for it, so a metrics-only deployment stays two containers lighter.
  # See docs/logging.md.
  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    # Comes back after a reboot or a daemon restart, but stays down once
    # deliberately stopped. This half of the deployment is the always-on
    # one: without it a power cut leaves the stack down until somebody
    # notices, while every client fills its queue and then blocks.
    restart: unless-stopped
    profiles: [logs]
    depends_on:
      init-state-dirs:
        condition: service_completed_successfully
    # Not published to the host: only Grafana and Alloy talk to Loki, both
    # from inside this network. Reaching it from another machine is a
    # deliberate step, not the default (see docs/logging.md).
    expose:
      - "3100"
    command:
      - -config.file=/etc/loki/config.yaml
      # Lets ${LOKI_RETENTION_PERIOD} in the config come from .env.
      - -config.expand-env=true
    environment:
      - LOKI_RETENTION_PERIOD=${LOKI_RETENTION_PERIOD:-720h}
    volumes:
      - type: bind
        source: ./loki/config.yaml
        target: /etc/loki/config.yaml
        read_only: true
      - type: bind
        source: .loki/data
        target: /loki
    # No healthcheck, unlike every other service here: the image is
    # distroless and contains exactly one binary, /usr/bin/loki. There is
    # no shell, wget or curl for a CMD check to use, and Docker offers no
    # way to probe one container from another. Alloy retries a failed push,
    # so the seconds before Loki is ready cost nothing.

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    # Comes back after a reboot or a daemon restart, but stays down once
    # deliberately stopped. This half of the deployment is the always-on
    # one: without it a power cut leaves the stack down until somebody
    # notices, while every client fills its queue and then blocks.
    restart: unless-stopped
    profiles: [logs]
    depends_on:
      # service_started, not service_healthy: Loki has no healthcheck to
      # wait on (see above). This only orders startup.
      loki:
        condition: service_started
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # Without this the UI binds to localhost inside the container and
      # the port below reaches nothing.
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      # Alloy's own UI, showing each component's health and what it last
      # sent. The first place to look when logs are not arriving.
      #
      # Loopback only. The UI has no authentication and describes the
      # deployment — component configuration, endpoints, recently sent
      # data — so it sits on the same side of the line as InfluxDB's and
      # Grafana's ports above. Reach it over SSH with
      # `ssh -L 12345:127.0.0.1:12345 <host>`.
      #
      # Written out rather than taking LABMON_BIND_ADDRESS: that variable
      # exists so a server can publish InfluxDB and Grafana to clients,
      # which is a normal thing to want, and it must not quietly hand out
      # an unauthenticated diagnostic UI along with them.
      - "127.0.0.1:12345:12345"
    volumes:
      - type: bind
        source: ./alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      # Reading container logs means talking to the Docker API, and access
      # to this socket is equivalent to root on the host. read_only does
      # not meaningfully restrict it — the socket is still a full API.
      # This is the cost of collecting logs without touching each
      # container; docs/logging.md covers what to do if that trade is
      # wrong for your machine.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      # The host journal, for sensors run under systemd rather than in a
      # container (see deploy/). Read-only, and the Alloy config collects
      # only labmon's own units rather than the whole machine.
      #
      # A host that keeps logs in memory only has them at /run/log/journal
      # instead; both are mounted so either works, and a missing one is an
      # empty directory rather than an error.
      - type: bind
        source: /var/log/journal
        target: /var/log/journal
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /run/log/journal
        target: /run/log/journal
        read_only: true
        bind:
          create_host_path: true
      # Journal entries are keyed by machine id; without this the reader
      # cannot resolve which machine's journal it is looking at.
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
      # A named volume rather than a bind: this is Alloy's own bookkeeping
      # (how far it has read in each container's log), not something to
      # inspect, and Alloy runs as root — a bind would leave a root-owned
      # directory in the repo that needs sudo to delete.
      - alloy-data:/var/lib/alloy/data

  mock-room-1:
    <<: *mock-sensor
    container_name: mock-room-1
    command:
      - --sensor-id=room-1
      - --measurement=temperature
      - --setpoint=21
      - --noise=0.15
      - --unit=°C
      - --resolution=0.001

  mock-room-2:
    <<: *mock-sensor
    container_name: mock-room-2
    command:
      - --sensor-id=room-2
      - --measurement=temperature
      - --setpoint=22
      - --noise=0.15
      - --unit=°C
      - --resolution=0.001

  mock-cryo-77k:
    <<: *mock-sensor
    container_name: mock-cryo-77k
    command:
      - --sensor-id=cryo-77k
      - --measurement=temperature
      - --setpoint=77
      - --noise=0.3
      - --unit=K
      - --resolution=0.001

  mock-cryo-4k:
    <<: *mock-sensor
    container_name: mock-cryo-4k
    command:
      - --sensor-id=cryo-4k
      - --measurement=temperature
      - --setpoint=4.2
      - --noise=0.05
      - --unit=K
      - --resolution=0.001

  mock-pressure:
    <<: *mock-sensor
    container_name: mock-pressure
    command:
      - --sensor-id=chamber-1
      - --measurement=pressure
      - --setpoint=1.5e-7
      - --noise=5e-9
      - --unit=mbar

  # A wavemeter reads out a frequency directly rather than through an
  # ADC, so it is simulated rather than calibrated. Stored in Hz so
  # Grafana's own SI scaling turns it into THz, and so the few-MHz drift
  # stays visible against a 276 THz carrier.
  mock-wavemeter:
    <<: *mock-sensor
    container_name: mock-wavemeter
    command:
      - --sensor-id=wavemeter-1
      - --measurement=frequency
      - --setpoint=276561300000000
      - --noise=400000
      - --interval=2
      - --unit=Hz
      # 100 kHz steps. The default rounds to six significant digits,
      # which at 276 THz is a 1 GHz step — coarser than the whole drift,
      # so consecutive readings would come back identical.
      - --resolution=1e5

  # The demo's second acquisition path. Unlike the mock sensors above,
  # which invent a value already in physical units, these two run the
  # real serial pipeline: a feeder streams raw ADC counts over TCP in the
  # firmware's wire format, and `serial-sensor` reads them through a
  # socket:// URL, calibrates them, and writes value + input_volts +
  # calibration_id. Nothing here is mocked except the board itself.
  demo-adc-feeder:
    <<: *mock-sensor
    container_name: demo-adc-feeder
    # Overrides the image's ENTRYPOINT ["labmon", "mock-sensor"]. The feeder is
    # stdlib-only, so it runs in this image with nothing added.
    entrypoint: ["python", "/app/demo/adc_feeder.py"]
    # Replaces the anchor's environment rather than adding to it: a YAML
    # merge key does not deep-merge lists. That is what we want here — the
    # feeder writes nothing to InfluxDB, so it has no business holding the
    # auth token. It binds every interface because demo-serial-sensor
    # connects from another container; no ports are published, so this
    # stays inside the compose network.
    environment:
      - ADC_FEEDER_HOST=0.0.0.0
    volumes:
      - ./demo:/app/demo:ro

  demo-serial-sensor:
    <<: *mock-sensor
    container_name: demo-serial-sensor
    entrypoint: ["labmon", "serial-sensor"]
    depends_on:
      influxdb:
        condition: service_healthy
      demo-adc-feeder:
        condition: service_started
    volumes:
      - ./demo:/app/demo:ro
    command:
      - --port=socket://demo-adc-feeder:5555
      - --calibration=/app/demo/calibration.demo.toml

  # TLS termination for the LAN, off unless COMPOSE_PROFILES includes it.
  # Additive by design: the plain 8181/3000 ports keep working exactly as
  # before, so a deployment adopts TLS on its own schedule rather than at
  # upgrade time. See docs/deployment.md.
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    # Comes back after a reboot or a daemon restart, but stays down once
    # deliberately stopped. This half of the deployment is the always-on
    # one: without it a power cut leaves the stack down until somebody
    # notices, while every client fills its queue and then blocks.
    restart: unless-stopped
    profiles: [tls]
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "8443:8443"
      - "3443:3443"
      # Loki's push endpoint, for sensors on other machines. Answers with
      # 404 to anything but the push path, and denies every credential
      # until one is configured — see the Caddyfile.
      - "3444:3444"
    environment:
      # The addresses the proxy answers on, one list per port, each
      # entry becoming a site address Caddy issues a certificate for.
      # Separated by a comma AND a space; Caddy rejects a bare comma.
      - LABMON_TLS_INFLUXDB_SITES=${LABMON_TLS_INFLUXDB_SITES:-https://127.0.0.1:8443}
      - LABMON_TLS_GRAFANA_SITES=${LABMON_TLS_GRAFANA_SITES:-https://127.0.0.1:3443}
      - LABMON_TLS_LOKI_SITES=${LABMON_TLS_LOKI_SITES:-https://127.0.0.1:3444}
      # The credential a remote Alloy sends with every push. The default
      # hash is bcrypt of random bytes nobody kept, so the endpoint refuses
      # everything until this is set — see docs/deployment.md.
      - LABMON_LOKI_PUSH_USER=${LABMON_LOKI_PUSH_USER:-labmon}
      - LABMON_LOKI_PUSH_HASH=${LABMON_LOKI_PUSH_HASH:-$$2a$$14$$lGM8y2sOFhWF4TvWFA8kD.WH8nCwgejJLWuHR4fOkD/xIZg33kdV2}
      # Which of them to serve when a client sends no SNI, which is what
      # addressing the server by IP does.
      - LABMON_TLS_DEFAULT_SNI=${LABMON_TLS_DEFAULT_SNI:-127.0.0.1}
    volumes:
      - type: bind
        source: ./caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      # The CA's private key and certificates. Named rather than bound so
      # nothing root-owned lands in the repo — but unlike alloy-data this
      # one must NOT be discarded: losing it means every client that
      # trusts the old root has to be visited again. `docker compose down
      # -v` destroys it. See docs/deployment.md.
      - type: volume
        source: caddy-data
        target: /data
    healthcheck:
      # Caddy's admin API, on loopback inside the container only. Proves
      # the process is up and its config loaded; the TLS ports themselves
      # are proven by the smoke job.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  # Alloy's read positions. Named rather than bound so nothing root-owned
  # lands in the repo; `docker compose down -v` resets it, at the cost of
  # re-reading each container's log from the start.
  alloy-data:
  # Caddy's internal CA: its root key, the intermediate, and every leaf
  # it has issued. Deliberately outlives container recreation — the root
  # is what every client was told to trust, so losing it invalidates all
  # of them at once.
  caddy-data:
