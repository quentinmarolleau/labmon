[project]
name = "labmon"
version = "0.3.0"
description = "Flexible laboratory monitoring system"
# Not README.md. That file is written for GitHub — a header image, four
# terminal recordings, and two dozen links relative to the repository
# root, every one of which 404s on a PyPI project page, which has no
# repository behind it to resolve them against.
readme = "README.pypi.md"
requires-python = ">=3.12"
# PEP 639 spelling: an SPDX expression plus the files it refers to. The
# `License :: OSI Approved ::` classifier is the older way of saying the
# same thing and is deprecated; the two must not both appear, so the
# classifier list below deliberately has no license entry.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Quentin Marolleau", email = "q.marolleau-dev@pm.me" }]
keywords = [
    "laboratory",
    "monitoring",
    "time-series",
    "influxdb",
    "sensors",
    "physics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "asteval>=1.0.9",
    "influxdb3-python>=0.20.0",
    "pint>=0.25.3",
    "pyserial>=3.5",
    "python-dotenv>=1.2.3",
    "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/quentinmarolleau/labmon"
Documentation = "https://github.com/quentinmarolleau/labmon/tree/main/docs"
Changelog = "https://github.com/quentinmarolleau/labmon/blob/main/CHANGELOG.md"
Issues = "https://github.com/quentinmarolleau/labmon/issues"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    # A CA bundle at a known path, for the two tests that check `--cacert`
    # is actually loaded. Already present through influxdb3-python; named
    # here because a test depends on it, and because
    # `ssl.get_default_verify_paths()` answers None on a CI runner while
    # typeshed declares it a str.
    "certifi>=2026.7.22",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "polars>=1.44.0",
    "pre-commit>=4.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "scipy>=1.18.0",
    "scipy-stubs>=1.18.0.1",
    "textual>=8.2.8",
    "typos>=1.49.0",
    "xarray>=2026.7.0",
]

[project.scripts]
labmon = "labmon.cli.main:main"
# Deprecated aliases for `labmon mock-sensor` / `labmon serial-sensor`.
# They shipped in v0.2.0-beta.1 and are therefore in compose files and
# systemd units labmon does not control, so they keep working and warn
# once at startup. To be removed in 1.0.
mock-sensor = "labmon.cli.deprecated:mock_sensor_main"
serial-sensor = "labmon.cli.deprecated:serial_sensor_main"

[project.optional-dependencies]
spline = [
    "scipy>=1.18.0",
]
# CSV, Parquet and Feather need nothing extra: pyarrow is already a hard
# dependency of influxdb3-python. netCDF is the one format that costs, so
# it is opt-in rather than imposed on every sensor host that only writes.
netcdf = [
    # h5netcdf is a thin layer over h5py and does not depend on it, so an
    # install without h5py imports fine and then fails at the first write
    # with "backend not available". Named here so that cannot happen.
    "h5netcdf>=1.3.0",
    "h5py>=3.11.0",
    "xarray>=2024.7.0",
]
tui = [
    "textual>=8.2.8",
]

[build-system]
# 1.27 is where PEP 639 landed; an older hatchling rejects the `license`
# expression and `license-files` above.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Hatchling infers this from the project name under a src layout. Spelled
# out because the inference is silent when it goes wrong, and because
# py.typed is only picked up if the package directory is the unit being
# copied.
packages = ["src/labmon"]

[tool.hatch.build.targets.sdist]
# Without an include list hatchling ships everything git does not ignore,
# which measured 1.9 MB: docs/ and its screenshots and recordings, the
# firmware tree, the type stubs, and whatever a manual `labmon export`
# had last left in the working tree.
#
# tests/ is left out on purpose rather than by omission. The suite checks
# the repository, not the package: test_dashboard.py reads grafana/,
# test_alloy_config.py reads alloy/, test_calibration.py reads demo/ and
# calibration.example.toml. Shipping it would mean shipping those trees
# too, which is the whole repository again by a longer route.
#
# README.md is not here either. It is the GitHub page, it links to images
# and docs that are not in the sdist, and README.pypi.md reaches it by
# absolute URL rather than by path.
include = [
    "/src",
    "/README.pypi.md",
    "/CHANGELOG.md",
]

[tool.ruff]
# Matches requires-python above. Without it ruff infers a target from
# whichever interpreter happens to run it, so a rule that rewrites for a
# newer Python (pyupgrade) could propose something CI's oldest supported
# version cannot parse.
target-version = "py312"

[tool.ruff.lint]
# Added to ruff's defaults rather than replacing them, so a rule the
# upstream project decides is worth having by default arrives here too.
# The cost is that a release can introduce one and turn CI red on code
# nobody touched; the answer to that is to pin ruff in the dev
# dependencies when it happens, not to freeze the rule set in advance.
extend-select = [
    "G",    # flake8-logging-format
    "LOG",  # flake8-logging
    "RUF",  # ruff's own rules
    "DTZ",  # timezone-aware datetimes
    "PTH",  # pathlib over os.path
    "C4",   # comprehensions
    "PIE",  # dead syntax
    "RET",  # return-statement hygiene
    "PERF", # avoidable slow patterns
    "A",    # builtin shadowing
    "ARG",  # unused arguments
    "S",    # bandit
]

# `G` is the reason this section exists. Every logging call in the package
# names its data in `extra=` so a collector reads fields rather than
# parsing a sentence, and nothing enforced that: `G003` had already crept
# back into writer.py. Note that `G004` flags f-strings in logging calls
# and leaves `logger.warning("...%r", value)` alone — the lazy form is the
# endorsed one, so a sweep towards f-strings would fight this rule.
#
# `LOG` is its neighbour: `logging.warn()`, a logger built with the wrong
# name, `.error()` where `.exception()` was meant. Clean today, and it
# guards the same call sites from a different direction.
#
# `RUF043` is why `RUF` is here. A `pytest.raises(match=...)` pattern is a
# regex whether or not it was meant as one, so `match="a (b)"` silently
# asserts something other than it appears to. Marking the deliberate ones
# raw makes the accidental ones visible.

# `DTZ` is the one on that second list that guards something this project
# depends on rather than tidiness. Every reading is stamped before it is
# written, and a naive `datetime.now()` reaching a `.time()` call is
# silently wrong: the point lands at an offset that depends on the host's
# timezone, and nothing fails until two sources are compared and disagree
# by hours.
#
# `S` (bandit) is worth its suppressions for the rules nothing has tripped
# yet: hardcoded passwords and tokens (`S105`-`S107`), which is the shape
# a value takes when it is inlined "just to check something" on a public
# repo, and `S324`, which stops the calibration fingerprint being moved
# off sha256 quietly.

# `RUF001`-`RUF003` catch a character that looks like ASCII and is not,
# which is worth catching in an identifier and wrong for a unit or a
# symbol. Every entry here is notation a physicist writes by hand, and
# spelling them `\u03c3` in the source to satisfy a linter would make the
# code harder to read than the problem the linter is guarding against.
allowed-confusables = ["\u00b5", "\u03c3", "\u2212", "\u00b0"]

[tool.ruff.lint.per-file-ignores]
# `S101` is "use of assert", which is what a test is made of. Every one of
# the 1156 findings is here, and nowhere else, so the exemption removes
# exactly the noise and nothing more.
"tests/*" = ["S101"]
# The stubs describe libraries this project does not own, parameter names
# included: `pa.array(obj, type=...)` has to be spelled the way pyarrow
# spells it or the annotation describes a different function.
"typings/*" = ["A002"]

[tool.basedpyright]
include = ["src", "tests", "scripts", "demo", "templates"]
stubPath = "typings"

[tool.pytest.ini_options]
# Without this, pytest collects from the repo root, so anything named
# test_*.py left there — a scratch script, a notebook, a downloaded
# example — is imported and run as part of the suite.
testpaths = ["tests"]

[tool.coverage.run]
# Everything that ships, not just the package. `demo/`, `scripts/` and
# `templates/` are three trees a user meets early — the demo stack
# acquires from one, CI's own gates are two files in another, and the
# third exists to be copied into somebody else's project — and none of
# them was measured. That is the same blind spot #82 closed for
# basedpyright, in the test dimension.
#
# Spelled here rather than as `--cov=` flags so the pre-commit hook, the
# CI job and a bare `pytest --cov` all measure the same four trees, and
# adding a fifth is one edit rather than three.
source = ["src", "demo", "scripts", "templates"]

[tool.typos.default.extend-identifiers]
# Misspelled in the D3 Gauge panel plugin's own options schema, so the
# dashboard JSON has to spell it the same way. Scoped to the full identifier
# so a bare "tickness" is still reported.
ticknessGaugeBasis = "ticknessGaugeBasis"
