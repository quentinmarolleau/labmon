[project]
name = "labmon"
version = "0.1.0"
description = "Flexible laboratory monitoring system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asteval>=1.0.9",
    "influxdb3-python>=0.20.0",
    "pint>=0.25.3",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "scipy>=1.18.0",
    "scipy-stubs>=1.18.0.1",
    "typos>=1.49.0",
]

[project.scripts]
mock-sensor = "labmon.sensors.mock_sensor:main"
serial-sensor = "labmon.sensors.serial_sensor:main"

[project.optional-dependencies]
spline = [
    "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
include = ["src", "tests", "scripts"]
stubPath = "typings"

[tool.coverage.run]
source = ["src"]

[tool.typos.default.extend-identifiers]
# Misspelled in the D3 Gauge panel plugin's own options schema, so the
# dashboard JSON has to spell it the same way. Scoped to the full identifier
# so a bare "tickness" is still reported.
ticknessGaugeBasis = "ticknessGaugeBasis"
