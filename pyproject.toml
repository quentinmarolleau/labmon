[project]
name = "labmon"
version = "0.1.0"
description = "Flexible laboratory monitoring system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "influxdb3-python>=0.20.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "typos>=1.48.0",
]

[project.scripts]
mock-temperature-sensor = "labmon.sensors.mock_temperature:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
include = ["src", "tests"]
stubPath = "typings"

[tool.coverage.run]
source = ["src"]
