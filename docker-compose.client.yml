# Compose file for a client machine (e.g. a Raspberry Pi) pushing sensor
# data to a remote labmon server — see docs/client-setup.md and
# docs/deployment.md. Unlike docker-compose.yml, there's no InfluxDB or
# Grafana here: this machine only runs sensor(s) that write to the server
# over the network.
#
# Usage:
#   cp .env.client.example .env
#   docker compose -f docker-compose.client.yml build
#   docker compose -f docker-compose.client.yml up -d --wait
#
# `sensor-1` below runs `mock-sensor`, which simulates readings rather
# than reading hardware — useful on a fresh client to prove it can reach
# the server before wiring anything up. `--setpoint`/`--noise`/
# `--log-scale` only shape the simulated random walk and mean nothing for
# a real sensor.
#
# To read an actual board, use the commented-out `serial-sensor` service
# at the bottom of this file instead — see docs/serial-sensor.md.
#
# Running several sensors on this device in parallel: give each its own
# service extending the x-labmon-sensor anchor below, its own
# container_name, and a command with a distinct --sensor-id (see the
# commented-out `sensor-2` example).
x-labmon-sensor: &labmon-sensor
  build: .
  image: labmon:latest
  restart: unless-stopped
  environment:
    - INFLUXDB_HOST=${INFLUXDB_HOST}
    - INFLUXDB_DATABASE=${INFLUXDB_DATABASE:-lab}
    - INFLUXDB3_AUTH_TOKEN=${INFLUXDB3_AUTH_TOKEN}
    # Only when the server runs the `tls` profile — see
    # docs/client-setup.md. Empty reads the same as unset here, so
    # leaving it out of .env keeps the client on plain HTTP.
    - INFLUXDB_TLS_CA=${INFLUXDB_TLS_CA:-}
  # The certificate has to exist inside the container as well, at the
  # path the variable names — mounting it there means one value serves a
  # bare install and a container alike. Uncomment alongside the variable:
  # left in place, a bind mount of a file that is not there would have
  # Docker silently create a directory where the certificate should be.
  #
  # A service that declares its own `volumes:` replaces this list rather
  # than adding to it, so `serial-sensor` below carries its own copy of
  # the line.
  # volumes:
  #   - ${INFLUXDB_TLS_CA}:${INFLUXDB_TLS_CA}:ro

services:
  # Ships this machine's logs to the server's Loki, so a sensor running
  # here appears in the same dashboards as one running on the server.
  # Under a profile, because it is a considered step rather than the
  # default: it needs a credential and the server's CA, and it sends log
  # lines off this machine.
  #
  #     COMPOSE_PROFILES=logs docker compose -f docker-compose.client.yml up -d
  #
  # See docs/client-setup.md.
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: labmon-alloy
    restart: unless-stopped
    profiles: [logs]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # Without this the UI binds to localhost inside the container and
      # the port below reaches nothing.
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      # Alloy's own UI, showing each component's health and what it last
      # sent. The first place to look when a client's logs are not
      # arriving — it reports a rejected credential here.
      - "12345:12345"
    environment:
      # Where the server's proxy accepts pushes, and what to send with
      # them. All four are required; there is no useful default for any.
      - LABMON_LOKI_URL=${LABMON_LOKI_URL}
      - LABMON_LOKI_PUSH_USER=${LABMON_LOKI_PUSH_USER:-labmon}
      - LABMON_LOKI_PUSH_PASSWORD=${LABMON_LOKI_PUSH_PASSWORD}
      # Names this machine in every line it sends. Two clients running the
      # same container names are otherwise one indistinguishable stream.
      - LABMON_CLIENT_NAME=${LABMON_CLIENT_NAME}
      # The same CA the sensor verifies InfluxDB with, read inside the
      # container from the mount below.
      - INFLUXDB_TLS_CA=${INFLUXDB_TLS_CA}
    volumes:
      - type: bind
        source: ./alloy/client.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      # Unlike the sensor services, this mount is not optional: reaching
      # the server means TLS, and a private root is in no trust store.
      #
      # The default is a placeholder rather than a suggestion. An unset
      # variable would expand to `::ro`, which fails to parse — so every
      # client running `docker compose config` would see an error about
      # this file whether or not it ships logs at all.
      - ${INFLUXDB_TLS_CA:-/etc/labmon/labmon-ca.crt}:${INFLUXDB_TLS_CA:-/etc/labmon/labmon-ca.crt}:ro
      # Reading container logs means talking to the Docker API, and access
      # to this socket is equivalent to root on this machine. read_only
      # does not meaningfully restrict it — the socket is still a full
      # API. See docs/logging.md for what to do if that trade is wrong
      # here.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      # The journal, for a bare install running under systemd rather than
      # in a container. Both paths are mounted so a host keeping logs in
      # memory only works too, and a missing one is an empty directory
      # rather than an error.
      - type: bind
        source: /var/log/journal
        target: /var/log/journal
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /run/log/journal
        target: /run/log/journal
        read_only: true
        bind:
          create_host_path: true
      # Journal entries are keyed by machine id; without this the reader
      # cannot resolve which machine's journal it is looking at.
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
      # Alloy's own bookkeeping — how far it has read in each log. A named
      # volume rather than a bind, since Alloy runs as root and a bind
      # would leave a root-owned directory in the checkout.
      - alloy-data:/var/lib/alloy/data

  sensor-1:
    <<: *labmon-sensor
    container_name: labmon-sensor-1
    command:
      - --sensor-id=CHANGE-ME-1
      - --measurement=CHANGE-ME
      - --unit=CHANGE-ME

  # sensor-2:
  #   <<: *labmon-sensor
  #   container_name: labmon-sensor-2
  #   command:
  #     - --sensor-id=CHANGE-ME-2
  #     - --measurement=CHANGE-ME
  #     - --unit=CHANGE-ME

  # A real board read over serial, rather than a simulated sensor. See
  # docs/serial-sensor.md — including the udev rule that gives the board
  # the stable /dev/labmon-due name used here.
  #
  # entrypoint: overrides the image's baked-in ENTRYPOINT ["mock-sensor"].
  # devices: passes the serial device through to the container.
  # volumes: the calibration file is read at startup and never written.
  #
  # serial-sensor:
  #   <<: *labmon-sensor
  #   container_name: labmon-serial-sensor
  #   entrypoint: ["serial-sensor"]
  #   devices:
  #     - /dev/labmon-due:/dev/labmon-due
  #   volumes:
  #     - ./calibration.toml:/app/calibration.toml:ro
  #     # Only with the tls profile, as above.
  #     - ${INFLUXDB_TLS_CA}:${INFLUXDB_TLS_CA}:ro
  #   command:
  #     - --port=/dev/labmon-due
  #     - --calibration=/app/calibration.toml

volumes:
  alloy-data:
