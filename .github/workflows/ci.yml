name: CI

on:
  # No branch filter on pull_request, so a PR based on another feature
  # branch is checked too. With one, a stacked PR matches nothing and
  # GitHub reports "no checks reported" rather than failing — so it can
  # look mergeable having never been tested. That happened twice while
  # building the custom-sensor and log-aggregation series.
  #
  # push stays filtered: a branch push with an open PR is already covered
  # by pull_request, and filtering here avoids running everything twice.
  pull_request:
  push:
    branches: [main]

# Every job here only reads the repository; Codecov uploads with its own
# token rather than GITHUB_TOKEN. Setting this at the top means a job added
# later starts read-only unless it says otherwise.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
      - run: uv run --locked basedpyright

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
      - run: uv run --locked typos

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked pytest --cov=src --cov-report=xml --cov-fail-under=100
      - if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
