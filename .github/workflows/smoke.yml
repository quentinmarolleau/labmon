name: smoke

on:
  # No branch filter on pull_request, so a PR based on another feature
  # branch is checked too. With one, a stacked PR matches nothing and
  # GitHub reports "no checks reported" rather than failing — so it can
  # look mergeable having never been tested. That happened twice while
  # building the custom-sensor and log-aggregation series.
  #
  # push stays filtered: a branch push with an open PR is already covered
  # by pull_request, and filtering here avoids running everything twice.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cold-start:
    name: cold start
    runs-on: ubuntu-latest
    # Generous: most of it is image pulls and the wait for sensors to write.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deliberately the README's quickstart, command for command. A fresh
      # runner is the closest thing CI has to somebody cloning the repo, and
      # the bugs this job exists to catch only happen on the first run.
      - name: Bootstrap .env the way the quickstart does
        run: |
          cp .env.example .env
          sed -i 's/^INFLUXDB_NODE_ID=.*/INFLUXDB_NODE_ID=ci/' .env

      - name: Start InfluxDB and mint an admin token
        run: |
          docker compose up -d --wait influxdb
          token="$(docker compose exec -T influxdb influxdb3 create token --admin \
            | grep -oE 'apiv3_[A-Za-z0-9_-]+' | head -1)"
          if [ -z "$token" ]; then
            echo "no token in the create-token output" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          grep -v '^INFLUXDB3_AUTH_TOKEN=' .env > .env.next
          mv .env.next .env
          printf 'INFLUXDB3_AUTH_TOKEN=%s\n' "$token" >> .env

      # Fails on its own if any service is unhealthy, which is what caught
      # nothing before this job existed.
      - name: Start the whole stack
        run: docker compose up -d --wait

      - name: Every service is up
        run: docker compose ps

      # Adding the profile to a running stack rather than starting a second
      # one: Loki and Alloy join what is already up, so this costs two
      # containers rather than another full bootstrap.
      #
      # Ahead of the dashboard check, which now runs the Logs dashboard's
      # LogQL as well and so needs Loki up. Collection is asserted first
      # for the same reason: when Alloy is not shipping, every Loki panel
      # is empty too, and this check names the container that is missing
      # rather than the six panels that noticed.
      - name: Start log collection
        run: COMPOSE_PROFILES=demo,logs docker compose up -d --wait loki alloy

      - name: Every container's logs reach Loki
        run: python3 scripts/smoke_logs.py --timeout 120

      - name: Every dashboard query returns rows
        run: python3 scripts/smoke_dashboard.py --timeout 180

      # Same trick again: the proxy joins the running stack rather than
      # starting a second one. The site lists name `caddy` as well as
      # loopback, so a container on the compose network can reach it under
      # a name the certificate actually covers.
      - name: Start the TLS proxy
        run: |
          # A real push credential, generated here and used by the step
          # below. The shipped default is bcrypt of random bytes nobody
          # kept, so without this every push is refused — which is the
          # point of it, but leaves nothing to test the open path with.
          password="$(head -c 18 /dev/urandom | base64)"
          hash="$(docker run --rm caddy:2.10-alpine \
            caddy hash-password --plaintext "$password")"
          echo "LOKI_PUSH_PASSWORD=$password" >> "$GITHUB_ENV"
          {
            printf 'LABMON_TLS_INFLUXDB_SITES="https://127.0.0.1:8443, https://caddy:8443"\n'
            printf 'LABMON_TLS_GRAFANA_SITES="https://127.0.0.1:3443, https://caddy:3443"\n'
            printf 'LABMON_TLS_LOKI_SITES="https://127.0.0.1:3444, https://caddy:3444"\n'
            printf 'LABMON_LOKI_PUSH_USER=labmon\n'
            # Single-quoted: a bcrypt hash is full of `$`, and compose
            # expands an unquoted `$name` in .env as a variable, cutting
            # that span out of the hash. Every push would then 401, with
            # the config looking correct.
            printf "LABMON_LOKI_PUSH_HASH='%s'\n" "$hash"
          } >> .env
          COMPOSE_PROFILES=demo,logs,tls docker compose up -d --wait caddy

      - name: Export the CA the way an operator would
        run: ./scripts/export-ca.sh labmon-ca.crt

      # Both ports must reject a client that does not trust the CA, and
      # accept one that does. The negative half matters most: without it a
      # proxy serving no TLS at all would pass.
      - name: Both TLS ports verify against the exported CA
        run: |
          for port in 8443 3443; do
            if curl -sS -o /dev/null "https://127.0.0.1:$port/" 2>/dev/null; then
              echo "port $port accepted a client with no CA — TLS is not enforced" >&2
              exit 1
            fi
            code="$(curl -sS --cacert labmon-ca.crt -o /dev/null \
              -w '%{http_code}' "https://127.0.0.1:$port/")"
            echo "port $port with the CA: HTTP $code"
            case "$code" in
              000) echo "port $port unreachable even with the CA" >&2; exit 1 ;;
            esac
          done

      # The whole point of the exercise: the exact path a real client
      # takes. Runs the shipped image so the package under test does the
      # writing, rather than a curl that only proves the proxy is up.
      - name: A sensor writes through the proxy
        run: |
          token="$(grep '^INFLUXDB3_AUTH_TOKEN=' .env | cut -d= -f2-)"
          network="$(docker inspect influxdb \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')"
          # --entrypoint, because the image's own is `labmon mock-sensor`:
          # without it `timeout` and its arguments are appended to the
          # sensor's command line instead of wrapping it.
          # --preserve-status reports the sensor's own fate rather than
          # timeout's, so a crash on the TLS path reads differently in the
          # log from the SIGTERM that ends a healthy run.
          status=0
          docker run --rm --network "$network" \
            --entrypoint timeout \
            -v "$PWD/labmon-ca.crt:/ca.crt:ro" \
            -e INFLUXDB_HOST=https://caddy:8443 \
            -e INFLUXDB_TLS_CA=/ca.crt \
            -e INFLUXDB_DATABASE=lab \
            -e INFLUXDB3_AUTH_TOKEN="$token" \
            labmon:latest \
            --preserve-status 12 labmon mock-sensor --sensor-id tls-smoke \
              --measurement temperature --unit K --interval 1 || status=$?
          # 0 if it handled the signal, 143 if it took SIGTERM as it was.
          case "$status" in
            0|143) echo "sensor ended on the timeout (status $status)" ;;
            *) echo "sensor died on the TLS path (status $status)" >&2
               exit 1 ;;
          esac
          rows="$(docker compose exec -T influxdb influxdb3 query --database lab \
            --token "$token" \
            "SELECT count(*) AS n FROM temperature WHERE sensor_id = 'tls-smoke'" \
            | grep -oE '[0-9]+' | tail -1)"
          echo "rows written through TLS: ${rows:-0}"
          if [ "${rows:-0}" -lt 1 ]; then
            echo "no rows arrived through the proxy" >&2
            exit 1
          fi

      # The write and the query take different routes through the proxy:
      # HTTP for one, Flight SQL over cleartext HTTP/2 for the other, and
      # only the query depends on `versions h2c 2`. Reading the rows back
      # with `docker compose exec influxdb` would not touch the proxy at
      # all, so dropping that one line would leave CI green while every
      # client query returned 404 — the exact half-working state the
      # setting exists to prevent.
      - name: A client queries back through the proxy
        run: |
          token="$(grep '^INFLUXDB3_AUTH_TOKEN=' .env | cut -d= -f2-)"
          network="$(docker inspect influxdb \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')"
          docker run --rm -i --network "$network" \
            --entrypoint python \
            -v "$PWD/labmon-ca.crt:/ca.crt:ro" \
            -e INFLUXDB_HOST=https://caddy:8443 \
            -e INFLUXDB_TLS_CA=/ca.crt \
            -e INFLUXDB_DATABASE=lab \
            -e INFLUXDB3_AUTH_TOKEN="$token" \
            labmon:latest - <<'PY'
          from labmon.influx import get_client

          rows = (
              get_client()
              .query(
                  "SELECT count(*) AS n FROM temperature"
                  " WHERE sensor_id = \x27tls-smoke\x27"
              )
              .to_pylist()
          )
          print(f"Flight SQL through the proxy returned: {rows}")
          if not rows or rows[0]["n"] < 1:
              raise SystemExit("the query path through the proxy sees no rows")
          PY

      # Loki's push endpoint is the one the proxy authenticates, because
      # Loki itself authenticates nothing — so the credential and the path
      # restriction are the whole of its protection. Both are one line of
      # Caddyfile, and removing either leaves a working endpoint that is
      # simply open, which no other check here would notice.
      - name: The Loki push endpoint is shut without a credential
        run: |
          line="$(printf '{"streams":[{"stream":{"container":"smoke"},')"
          line="$line$(printf '"values":[["%s000000000","level=info msg=smoke"]]}]}' "$(date +%s)")"
          probe() {
            curl -s -o /dev/null -w '%{http_code}' --cacert labmon-ca.crt "$@"
          }
          push="https://127.0.0.1:3444/loki/api/v1/push"

          no_credential="$(probe -X POST -H 'Content-Type: application/json' \
            --data "$line" "$push")"
          # Built from the real one rather than written out, so the line
          # carries no literal user:password pair for a secret scanner to
          # object to.
          wrong_credential="labmon:not-$LOKI_PUSH_PASSWORD"
          wrong="$(probe -u "$wrong_credential" -X POST \
            -H 'Content-Type: application/json' --data "$line" "$push")"
          accepted="$(probe -u "labmon:$LOKI_PUSH_PASSWORD" -X POST \
            -H 'Content-Type: application/json' --data "$line" "$push")"
          # The same credential on a read path: the endpoint is for writing
          # log lines, not for reading back everything ever collected.
          read_back="$(probe -u "labmon:$LOKI_PUSH_PASSWORD" \
            'https://127.0.0.1:3444/loki/api/v1/label/container/values')"

          echo "no credential=$no_credential wrong=$wrong ok=$accepted read=$read_back"
          if [ "$no_credential" != "401" ] || [ "$wrong" != "401" ]; then
            echo "the push endpoint accepted an unauthenticated client" >&2
            exit 1
          fi
          if [ "$accepted" != "204" ]; then
            echo "the push endpoint refused a valid credential" >&2
            exit 1
          fi
          if [ "$read_back" != "404" ]; then
            echo "the push credential also reads: got $read_back, wanted 404" >&2
            exit 1
          fi

      # Grafana through the proxy is the viewer's route, so both suites run
      # again against it. Cheap — the stack is already up and warm.
      - name: Dashboards and logs work through the proxy
        run: |
          python3 scripts/smoke_dashboard.py --timeout 120 \
            --url https://127.0.0.1:3443 --cacert labmon-ca.crt
          python3 scripts/smoke_logs.py --timeout 120 \
            --url https://127.0.0.1:3443 --cacert labmon-ca.crt

      - name: Logs
        if: failure()
        run: COMPOSE_PROFILES=demo,logs,tls docker compose logs --no-color --tail 200

      # The profile is needed to stop its services as well as to start
      # them; without it Loki and Alloy are left running.
      - name: Stop
        if: always()
        run: COMPOSE_PROFILES=demo,logs,tls docker compose down -v
