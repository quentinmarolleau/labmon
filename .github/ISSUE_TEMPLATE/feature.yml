name: Idea or feature request
description: Something labmon should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Several larger ideas are already open as issues — TLS, mDNS
        discovery, a docs site, digitizing analog gauges. If yours is one of
        them, adding your reasoning to that issue is more useful than a
        duplicate: what those entries lack is a concrete need. Ideas not yet
        agreed to be built carry the `needs-decision` label, and a case for
        one is exactly what moves it.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: >-
        The situation you were in, not the feature you have in mind. The
        feature is easier to design once the problem is clear.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered instead
      description: Including "nothing" — that is useful to know too.

  - type: dropdown
    id: hardware
    attributes:
      label: Does verifying this need physical hardware
      description: >-
        Several parts of this project cannot be fully tested without a board
        or an instrument in hand, which affects how it gets scheduled.
      options:
        - "No"
        - "Yes, and I have it"
        - "Yes, and I do not have it"
        - Not sure
    validations:
      required: true
