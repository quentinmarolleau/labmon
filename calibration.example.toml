# Example calibration for `serial-sensor` — copy to calibration.toml and
# edit for the sensors actually wired to your board.
#
# One [channels.<name>] section per channel the board streams. The name
# must match exactly what the firmware sends before the comma (see
# firmware/due_native_serial/due_native_serial.ino). A channel the board
# sends but this file doesn't list is logged once and ignored.
#
# conversion_factor is what turns the measured voltage into a physical
# quantity, and it carries its own units — the reading's unit is derived
# from it, not declared separately. Anything pint understands works.
#
# Offset units (degC, degF) can't be used: pint refuses to multiply by
# them, and serial-sensor rejects the file at startup if it finds one.
# Use kelvin, or delta_degC for a relative span.

[channels.A0]
sensor_id = "cryo-77k"
measurement = "temperature"
# 42.5 K per volt: a full-scale 3.3V reading is ~140 K.
conversion_factor = "42.5 kelvin / volt"

[channels.A1]
sensor_id = "chamber-1"
measurement = "pressure"
# A gauge whose output spans 0-3.3V over 0-3.3e-6 mbar.
conversion_factor = "1e-6 mbar / volt"
