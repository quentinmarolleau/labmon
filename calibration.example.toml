# Example calibration file. Copy to calibration.toml and edit for the
# sensors actually wired to your board.
#
# One [channels.<name>] section per channel the board streams; <name>
# must match what the firmware sends. Every section needs a sensor_id
# and a measurement (the InfluxDB tag and table the reading lands in),
# plus the fields for its conversion mode.
#
# Voltages are always in volts, the ADC's own output. A datasheet quoted
# in millivolts gets scaled once, here, rather than at every reading.
#
# Offset units (degC, degF) can't be used anywhere in a conversion: pint
# refuses to scale them, since 0 °C isn't "no temperature". Use kelvin
# for an absolute temperature, or delta_degC for a relative span. A file
# that gets this wrong is rejected at startup, not mid-run.

# Every reading is written with the voltage it was converted from, in an
# input_volts field, so a calibration corrected later can be applied to
# readings already stored. Uncomment to turn that off for every channel
# below; individual channels can override it either way.
# store_input = false

# --- linear: one dimensioned factor -------------------------------------
# For a response through the origin, e.g. from a linear fit of measured
# value against sensor voltage. The reading's unit is derived from the
# factor, so there's no separate unit to declare (or get wrong).
[channels.A0]
sensor_id = "photodiode-1"
measurement = "power"
conversion_factor = "50.0 mW / volt"   # 3.3V full scale -> ~165 mW

# --- affine: a factor plus an offset ------------------------------------
# Same, for a fit that doesn't pass through the origin. The offset must
# be dimensionally consistent with factor x volts, which is checked at
# startup.
[channels.A1]
sensor_id = "voltage-1"
measurement = "voltage" # remapping the [0, 3.3]V Arduino input range onto the [-15, 15] V range
mode = "affine"
conversion_factor = "9.0909091"
offset = "-15 V"
# offset_resolution = "5 mV"           # see "how many digits" below

# --- spline: a cubic through measured points ----------------------------
# For a curved response characterised by calibration measurements.
# Needs scipy:  pip install 'labmon[spline]'
# Note this EXTRAPOLATES beyond the measured range rather than clamping.
# Voltages must be monotonic, but may fall as well as rise — as they do
# here, an NTC's voltage dropping while temperature climbs.
[channels.A2]
sensor_id = "NTC-thermistor"
measurement = "temperature"
mode = "spline"
voltages = [3.3, 2.78, 2.12, 1.4, 0.72, 0.18] # voltages being here an image of the resistance
values = [273.15, 283.15, 293.15, 308.15, 328.15, 353.15]
value_unit = "kelvin"

# --- piecewise_linear: straight segments between the same points --------
# When a spline is more than the data justifies, or to avoid the scipy
# dependency on a small client. Unlike the spline this CLAMPS outside
# the measured range, holding the end values.
[channels.A3]
sensor_id = "photodiode-2"
measurement = "power"
mode = "piecewise_linear"
voltages = [0.0, 1.0, 2.0, 3.3]
values = [0.0, 100.1, 101.2, 332.3]
value_unit = "mW"

# --- expression: an arbitrary formula in v ------------------------------
# For a response with a known closed form. `v` is the voltage in volts.
# Common maths functions are available (sqrt, log, log10, exp, sin, ...).
# The expression is evaluated in a restricted interpreter — it can do
# arithmetic, not import modules or touch the filesystem.
[channels.A4]
sensor_id = "chamber-1"
measurement = "pressure"
mode = "expression"
expression = "10**(1.667*v - 11.33)"       # a typical Pirani gauge curve
value_unit = "mbar"

# --- how many digits a reading keeps ------------------------------------
# A converted value is rounded to the resolution the input actually had,
# so what lands in InfluxDB does not claim seventeen digits of a 12-bit
# measurement. Nothing above needs to say so: the step comes from
# --resolution-bits and --vref, carried through the conversion. A 12-bit
# input over 3.3 V steps by 806 uV, and channel A0's 50 mW/V turns that
# into 40 uW, so its readings are written to two decimals of a milliwatt.
#
# Only `linear` and `affine` have one step across their whole range. A
# spline's slope varies along its curve and an expression's is unknown,
# so those channels keep the computed value unless told otherwise:
#
#   significant_digits = 4
#
# Significant rather than decimal places, because a calibrated channel
# may sit anywhere on the scale — three decimals is far too coarse for
# channel A4's 1e-8 mbar and far too fine for a room thermometer. It
# overrides the derived step wherever it is set, which is also how a
# board that averages several conversions per reading claims the extra
# resolution that buys: the host sees only a fractional count, not how
# many were averaged, so the derived step stays conservative.
#
# `offset_resolution` says how well an affine offset is itself known,
# for one that came out of a fit rather than a divider ratio. It is
# independent of the ADC's own step, so the two combine in quadrature.
# The offset otherwise shifts the scale without dividing it, and adds
# nothing.
#
# Rounding happens once, on the way in, and applies to `value` only.
# `input_volts` keeps every digit it had — it is what a corrected
# calibration would be re-applied to, and rounding it would make that
# irrecoverable.

# --- stop_recording_when: take a channel out of service while its -------
# --- instrument is off --------------------------------------------------
# Optional, one table per channel. A signal that is only meaningful while
# its instrument is running — a photodiode watching a laser, a gauge on a
# chamber that gets vented — otherwise records noise at full rate,
# stretching dashboard axes and dragging every average computed over it.
#
# Written as what STOPS the recording, so `for` reads on the clause it
# governs: stop recording once the power has stayed below 1 mW for 30
# seconds. Conservative about stopping, eager about resuming — a resume
# is always immediate, so the turn-on transient is not swallowed.
# Nothing is written while the gate is closed, so the trace shows a gap;
# the transition is logged once, which is what makes that gap readable.
#
# `below` and `above` are the bounds; set either or both, and everything
# between them is recorded. They are dimensioned and checked against what
# the channel produces, so a wrong unit fails at startup.
[channels.A0.stop_recording_when]
below = "1.0 mW"           # under this, the laser is off
for = "30s"                # a brief dip does not stop recording
resume_above = "10.0 mW"   # deadband, so a value sitting at the bound
                           # does not flap between gap and fragment

# The two-sided form, gating on the raw input rather than the converted
# value: an open input at one end, a railed amplifier at the other. The
# bounds are then in volts whatever the channel converts to, and must
# read below <= resume_above < resume_below <= above.
# [channels.A1.stop_recording_when]
# raw_voltage = true
# below = "100 mV"
# above = "3.0 V"
# for = "1 min"                     # 'm' would be metres
# resume_below = "2.9 V"

# --- provenance: how a calibration was obtained -------------------------
# Optional, free-form, one table per channel. Logged at startup and never
# written to InfluxDB, so it documents the file without touching the
# data. Any keys are accepted; nothing is required.
#
# Readings are tagged with a calibration_id — a short hash of the
# channel's conversion — so a stored point can be matched back to the
# revision of this file that produced it. Editing the notes below does
# not change that id; editing a number above does.
[channels.A4.provenance]
date = "2026-07-28"
operator = "QM"
reference = "compared against the chamber's own Pfeiffer gauge"
notes = "valid from 1e-8 to 1 mbar; extrapolates badly above that"
